modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
# Client-only mod: servers without it are fully compatible, so don't mark
# them incompatible in the server list.
displayTest="IGNORE_ALL_VERSION"
authors="Caleb"
description='''
An unlocked camera: adds a fourth perspective to the vanilla view cycle (F5).
Between third person and front-facing third person comes a detached orbit
camera with scroll-wheel zoom, an over-the-shoulder offset when zoomed in,
and hold-to-freelook in first person.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
